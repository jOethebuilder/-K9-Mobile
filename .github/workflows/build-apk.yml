name: Build K-9 Mobile APK

# Builds a debug APK in the cloud so Joe doesn't need Android Studio or the
# SDK installed locally. Runs automatically on every push to main, and can
# also be triggered manually from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu-latest runner ships with the Android SDK preinstalled,
      # so no separate SDK download/setup step is needed for a plain assembleDebug.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

           - name: Build debug APK
        run: gradle assembleDebug --stacktrace
        working-directory: K9Mobile
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: k9-mobile-debug-apk
          path: K9Mobile/app/build/outputs/apk/debug/*.apk
